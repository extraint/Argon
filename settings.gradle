pluginManagement {
	repositories {
		maven { url = 'https://maven.fabricmc.net/'; name = 'Fabric' }
		maven { url = 'https://maven.kikugie.dev/releases/'; name = 'KikuGie Releases' }
		maven { url = 'https://maven-central.storage-download.googleapis.com/maven2'; name = 'Central mirror' }
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id 'dev.kikugie.stonecutter' version '0.9.8'
	id 'dev.kikugie.loom-back-compat' version '0.4.2'
}

// One shared codebase in src/, built for each Minecraft version below.
// Version-specific code uses Stonecutter comments (//? if ...); each version's
// dependency versions live in versions/<mc>/gradle.properties.
stonecutter {
	kotlinController = false
	centralScript = 'build.gradle'
	create(getRootProject()) {
		versions '1.21.11', '26.1.2', '26.2', '26.3'
		vcsVersion = '26.2'
	}
}

rootProject.name = 'argon'
