plugins {
	id 'net.fabricmc.fabric-loom' version '1.19-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	// Mirror of Maven Central, used when Central itself is unreachable or rate-limited
	maven { url = 'https://maven-central.storage-download.googleapis.com/maven2' }
	exclusiveContent {
		forRepository { maven { url = 'https://api.modrinth.com/maven' } }
		filter { includeGroup 'maven.modrinth' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "maven.modrinth:sodium:${project.sodium_version}"

	// Reference only: -PwithLithium loads Lithium in the dev client so benchmarks can compare against it
	if (project.hasProperty('withLithium')) {
		localRuntime "maven.modrinth:lithium:mc26.2-0.25.3-fabric"
	}

	// Dev only: -PextraMods=ferrite-core:9.0.0-fabric,krypton:0.3.1 loads other mods to smoke-test compatibility
	if (project.hasProperty('extraMods')) {
		project.property('extraMods').toString().split(',').each { localRuntime "maven.modrinth:${it.trim()}" }
	}

	// Optional integration: compiled against, and loaded in the dev client only
	compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
	if (!project.hasProperty('noModMenu')) {
		localRuntime "maven.modrinth:modmenu:${project.modmenu_version}"
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'argon-gametest'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
		clearRunDirectory = true
	}
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
